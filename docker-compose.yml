# docker compose up -d
# docker compose down
# docker compose logs -f backend
# docker compose up -d --build
# docker compose exec ollama ollama pull nomic-embed-text
# python3 -m tests.test_pipeline
# Ruff:
#   python -m pip install ruff
#   ruff check .
#   ruff format --check .

services:

  # ────────────────────────────────────────────────────────────
  # SERVICE 1 : MONGODB
  # Stores conversations + embedded messages
  # ────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7

    container_name: techcart_mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    volumes:
      - mongodb_data:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - techcart_network

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  # ────────────────────────────────────────────────────────────
  # SERVICE 2 : QDRANT
  # Stores vector embeddings
  # ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.5

    container_name: techcart_qdrant

    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO

    volumes:
      - ./data/vector_db:/qdrant/storage

    ports:
      - "6333:6333"
      - "6334:6334"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - techcart_network

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  # ────────────────────────────────────────────────────────────
  # SERVICE 3 : OLLAMA
  # Local LLM / embedding models
  # ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest

    container_name: techcart_ollama

    volumes:
      - ollama_models:/root/.ollama

    ports:
      - "11434:11434"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - techcart_network

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  # ────────────────────────────────────────────────────────────
  # SERVICE 4 : BACKEND
  # FastAPI application
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

    container_name: techcart_backend

    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MONGODB_DB: ${MONGO_DB}

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: techcart_bge_m3

      OLLAMA_BASE_URL: http://ollama:11434

      EMBEDDING_MODEL: bge-m3
      LLM_MODEL: mistral:latest

      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      RERANKER_USE_FP16: "false"
      RETRIEVAL_K: 20
      TOP_K_RESULTS: 5
      SIMILARITY_THRESHOLD: 0.0
      HF_HOME: /root/.cache/huggingface

    env_file:
      - .env

    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface

    ports:
      - "8000:8000"

    depends_on:
      mongodb:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      ollama:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - techcart_network

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  # ────────────────────────────────────────────────────────────
  # SERVICE 5 : FRONTEND
  # NGINX
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend

    container_name: techcart_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - techcart_network

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"


  # ────────────────────────────────────────────────────────────
  # SERVICE : POSTGRESQL
  # ────────────────────────────────────────────────────────────
  #
  # postgres:
  #   image: postgres:16-alpine
