
#   Start all:    docker compose up -d
#   Stop all:     docker compose down
#   View logs:    docker compose logs -f backend
#   Rebuild:      docker compose up -d --build


version: "3.9"

services:

  # ────────────────────────────────────────────────────────────
  # SERVICE 1 : MONGODB
  # Stores conversations + embedded messages
  # ────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7

    container_name: techcart_mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    volumes:
      - mongodb_data:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - techcart_network

  # ────────────────────────────────────────────────────────────
  # SERVICE 2 : QDRANT
  # Stores vector embeddings (vector search)
  # ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.5

    container_name: techcart_qdrant

    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO

    volumes:
      - ./data/vector_db:/qdrant/storage

    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - techcart_network

  # ────────────────────────────────────────────────────────────
  # SERVICE 3 : BACKEND (FastAPI)
  # Calls Ollama on the Windows host via host.docker.internal —
  # Ollama itself is NOT a service here anymore.
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

    container_name: techcart_backend

    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MONGODB_DB: ${MONGO_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: techcart_products
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    env_file:
      - .env

    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

    ports:
      - "8000:8000"

    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - techcart_network

  # ────────────────────────────────────────────────────────────
  # SERVICE 4 : FRONTEND (NGINX)
  # Serves HTML, CSS and JavaScript
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend

    container_name: techcart_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - techcart_network

  # ────────────────────────────────────────────────────────────
  # SERVICE : POSTGRESQL
  # ────────────────────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: techcart_postgres
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_INITDB_ARGS: "--encoding=UTF8"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./sql:/docker-entrypoint-initdb.d
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped
  #   networks:
  #     - techcart_network



volumes:
  mongodb_data:
  # postgres_data:

networks:
  techcart_network:
    driver: bridge